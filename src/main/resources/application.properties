# Servidor
server.port=8080

# Conexao com MySQL (ajuste usuario e senha no PC da faculdade se necessario)
spring.datasource.url=jdbc:mysql://localhost:3306/estante_virtual_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true